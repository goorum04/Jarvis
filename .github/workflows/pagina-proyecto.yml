# Publica en GitHub Pages (https://goorum04.github.io/Jarvis/) solo estas páginas,
# nunca el resto del repositorio:
#   /            la página del proyecto («URL de propósito» de Mercedes y WHOOP)
#   /instalar/   la guía para que Nacho instale JARVIS él solo
#   /preparar/   el generador del código de preparación (funciona en el navegador)
#   /guia/       la guía de uso (la misma que abre el botón GUÍA del panel)
name: Página del proyecto

on:
  push:
    branches: [main]
    paths:
      - "proyecto/**"
      - "guia/**"
      - ".github/workflows/pagina-proyecto.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Juntar las páginas
        run: |
          mkdir -p _site/guia
          cp -R proyecto/. _site/
          cp guia/index.html _site/guia/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
