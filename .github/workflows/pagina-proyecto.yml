# Publica la carpeta proyecto/ en GitHub Pages: https://goorum04.github.io/Jarvis/
# Es la «URL de propósito» del proyecto de Mercedes. Solo se publica esa carpeta,
# nunca el resto del repositorio.
name: Página del proyecto

on:
  push:
    branches: [main]
    paths:
      - "proyecto/**"
      - ".github/workflows/pagina-proyecto.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: proyecto
      - id: despliegue
        uses: actions/deploy-pages@v4
