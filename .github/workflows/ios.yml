# App de iPhone «JARVIS»: la compila en un Mac de GitHub y, si están las claves
# de Apple (ver GUIA_INSTALACION.md, «App de iPhone»), la firma y la sube a
# TestFlight. Sin claves solo comprueba que compila.
name: App de iPhone

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  schedule:
    # Las versiones de TestFlight caducan a los 90 días: se sube una nueva cada mes.
    - cron: "17 6 1 * *"
  workflow_dispatch:

concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.goorum04.jarvis' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TIENE_APPLE: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versiones
        run: xcodebuild -version && sw_vers -productVersion

      - name: Generar el proyecto de Xcode
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Compilar (comprobación, sin firmar)
        run: |
          cd ios
          status=0
          xcodebuild build -project JARVIS.xcodeproj -scheme JARVIS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          grep -E "(error|warning):" build.log | sort -u | head -150 || true
          tail -n 3 build.log
          exit $status

      # Abre la app en un iPhone simulado y saca capturas del arranque, de la
      # pantalla principal y de la de conectar. Quedan en «Artifacts» de la
      # ejecución (y, reducidas, en el registro, para revisarlas sin descargar).
      - name: Capturas en el simulador
        continue-on-error: true
        timeout-minutes: 15
        run: |
          cd ios
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone') and 'Pro' in x['name']))")
          xcrun simctl boot "$UDID"
          xcodebuild build -project JARVIS.xcodeproj -scheme JARVIS -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO -quiet
          xcrun simctl bootstatus "$UDID"
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/JARVIS.app"
          mkdir -p "$RUNNER_TEMP/capturas"
          capture() {
            xcrun simctl terminate "$UDID" "$IOS_BUNDLE_ID" 2>/dev/null || true
            SIMCTL_CHILD_JARVIS_CAPTURA="$2" xcrun simctl launch "$UDID" "$IOS_BUNDLE_ID"
            sleep "$3"
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/capturas/$1.png"
            sips -Z 900 -s format jpeg -s formatOptions 60 "$RUNNER_TEMP/capturas/$1.png" --out "$RUNNER_TEMP/$1.jpg" > /dev/null
            echo "CAPTURA $1 INICIO"; base64 -i "$RUNNER_TEMP/$1.jpg" | fold -w 900; echo "CAPTURA $1 FIN"
          }
          # La primera vez que se abre, la app tarda en arrancar: se abre una vez antes.
          xcrun simctl launch "$UDID" "$IOS_BUNDLE_ID"; sleep 20
          capture conectar "" 6
          capture arranque arranque 8
          capture principal principal 6

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: capturas-iphone
          path: ${{ runner.temp }}/capturas
          if-no-files-found: ignore

      - name: Firmar y subir a TestFlight
        if: env.TIENE_APPLE == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cd ios
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          # La clave se puede guardar en GitHub tal cual (el .p8) o en base64.
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild archive -project JARVIS.xcodeproj -scheme JARVIS -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/JARVIS.xcarchive" \
            "${AUTH[@]}" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" -quiet

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/JARVIS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" -quiet
          echo "Subida a TestFlight la versión 1.0 ($GITHUB_RUN_NUMBER). Apple tarda unos minutos en procesarla."
          rm -f "$KEY"

      - name: Sin claves de Apple
        if: env.TIENE_APPLE != 'true'
        run: echo "Compila bien. Para subirla a TestFlight faltan las claves de Apple en GitHub (GUIA_INSTALACION.md, «App de iPhone»)."
