<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080c">
<title>JARVIS</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; text-align: center;
    background: radial-gradient(circle at 50% 35%, #0d2230 0%, #05080c 70%); color: #d9ecf6;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    box-sizing: border-box;
  }
  main { max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  img { width: 96px; height: 96px; border-radius: 22px; opacity: 0.6; }
  h1 { margin: 6px 0 0; font-size: 24px; letter-spacing: 1px; }
  p { margin: 0; color: #8ea3b4; }
  button {
    margin-top: 8px; font: 700 16px/1 -apple-system, sans-serif; padding: 13px 22px; border-radius: 12px;
    border: none; background: #25c8f2; color: #02060a; cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <img src="/apple-touch-icon.png" alt="">
  <h1>JARVIS está descansando</h1>
  <p>Su Mac está cerrado, apagado o sin internet. Ábrelo y enchúfalo, espera un minuto y vuelve a intentarlo.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
